<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시스템 설계도 — 당직 업무 통합플랫폼</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
:root{
  --blue:#1D4994; --blue-d:#12305F; --orange:#F07B27;
  --ink:#16233A; --muted:#5F758F; --line:#DBE3EF; --rail:#F4F7FB; --sel:#E8F0FC;
  --red:#B3261E; --amber:#9A6212; --green:#12704F;
  --sans:"Pretendard","맑은 고딕",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#fff;color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6}

.top{background:var(--blue);color:#fff;padding:13px 18px;display:flex;flex-wrap:wrap;gap:14px;align-items:baseline}
.top h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em}
.top .sub{font-size:12.5px;color:#B9CDEB}
.top .stat{margin-left:auto;display:flex;gap:16px;font-size:12px;color:#B9CDEB;font-family:var(--mono)}
.top .stat b{color:#fff;font-weight:600}

.tools{display:flex;gap:8px;align-items:center;padding:9px 18px;border-bottom:1px solid var(--line);background:var(--rail);flex-wrap:wrap}
#q{flex:1;min-width:160px;border:1px solid var(--line);border-radius:3px;padding:6px 10px;font:inherit;font-size:13.5px;background:#fff}
.tb{border:1px solid var(--line);background:#fff;border-radius:3px;padding:5px 11px;font:inherit;font-size:12.5px;color:var(--muted);cursor:pointer}
.tb:hover{border-color:var(--blue);color:var(--blue)}
.tb:focus-visible,#q:focus-visible,.node:focus-visible{outline:2px solid var(--orange);outline-offset:1px}

.split{display:grid;grid-template-columns:minmax(340px,1fr) minmax(320px,420px);height:calc(100vh - 108px)}
.tree{overflow:auto;padding:10px 8px 60px;border-right:1px solid var(--line)}
.pane{overflow:auto;padding:18px 20px 60px;background:var(--rail)}

/* 트리 */
ul.t{list-style:none;margin:0;padding:0 0 0 14px}
ul.t.root{padding-left:0}
li.n{margin:0}
.node{display:flex;gap:7px;align-items:baseline;padding:3px 7px;border-radius:3px;cursor:pointer;border:1px solid transparent;width:100%;text-align:left;background:none;font:inherit;color:inherit}
.node:hover{background:var(--sel)}
.node.on{background:var(--sel);border-color:#B9CFEE}
.tw{width:12px;flex:none;color:var(--muted);font-size:10px;font-family:var(--mono);line-height:1.9}
.lbl{font-size:13.5px}
.node.lv0 .lbl{font-weight:800;font-size:14.5px}
.node.lv1 .lbl{font-weight:700}
.anc{font-family:var(--mono);font-size:11.5px;color:var(--blue);opacity:.85}
.badge{font-size:10.5px;padding:1px 6px;border-radius:2px;font-weight:700;flex:none}
.b-legacy{background:#FDECEA;color:var(--red)}
.b-check{background:#FBF1E0;color:var(--amber)}
.b-live{background:#E4F2EC;color:var(--green)}
.kids{display:none}
.kids.open{display:block}

/* 상세 */
.pane h2{margin:0 0 2px;font-size:19px;letter-spacing:-.02em}
.pane .path{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-bottom:14px}
.row{background:#fff;border:1px solid var(--line);border-radius:4px;padding:10px 13px;margin-bottom:9px}
.row .k{font-size:11.5px;color:var(--muted);margin-bottom:2px}
.row .v{font-size:13.5px}
.row .v.mono{font-family:var(--mono);font-size:12.5px;word-break:break-all;color:var(--blue-d)}
.desc{font-size:14px;margin:0 0 14px}
.note{border-left:3px solid var(--orange);background:#fff;padding:9px 12px;font-size:13.5px;border-radius:0 4px 4px 0;margin-bottom:12px}
.cp{width:100%;border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:3px;padding:9px;font:inherit;font-size:13.5px;cursor:pointer;margin-top:4px}
.cp:hover{background:var(--blue-d)}
.empty{color:var(--muted);font-size:13.5px;margin-top:40px;text-align:center}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 17px;border-radius:4px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .18s}
.toast.show{opacity:1}
@media (max-width:860px){
  .split{grid-template-columns:1fr;height:auto}
  .tree{border-right:0;border-bottom:1px solid var(--line);max-height:52vh}
  .pane{min-height:44vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <button class="tb" id="expand">모두 펼치기</button>

const S={legacy:["정리 대상","b-legacy"],check:["점검 필요","b-check"],live:["운영 중","b-live"]};
const tree=document.getElementById('tree'), pane=document.getElementById('pane');
let onlyFlag=false, q='';

function match(n){
  if(!q && !onlyFlag) return true;
  const hay=((n.l||'')+(n.anc||'')+(n.d||'')+(n.id||'')).toLowerCase();
  const qok = !q || hay.includes(q);
  const fok = !onlyFlag || n.s==='legacy' || n.s==='check';
  const self = qok && fok;
  return self || (n.k||[]).some(match);
}
function build(nodes, lv){
  const ul=document.createElement('ul');
  ul.className='t'+(lv===0?' root':'');
  for(const n of nodes){
    if(!match(n)) continue;
    const li=document.createElement('li'); li.className='n';
    const has=(n.k||[]).length>0;
    const btn=document.createElement('button');
    btn.className='node lv'+lv; btn.dataset.id=n.id;
    btn.innerHTML='<span class="tw">'+(has?'▸':'·')+'</span>'+
      '<span class="lbl">'+n.l+'</span>'+
      (n.anc?'<span class="anc">'+n.anc.split('←')[0].split('→')[0].trim().slice(0,34)+'</span>':'')+
      (n.s?'<span class="badge '+S[n.s][1]+'">'+S[n.s][0]+'</span>':'');
    li.appendChild(btn);
    if(has){
      const kid=document.createElement('div');
      kid.className='kids'+((q||onlyFlag||lv===0)?' open':'');
      kid.appendChild(build(n.k, lv+1));
      li.appendChild(kid);
      if(kid.classList.contains('open')) btn.querySelector('.tw').textContent='▾';
    }
    NODES[n.id]=n;
    ul.appendChild(li);
  }
  return ul;
}
const NODES={};
function draw(){ tree.innerHTML=''; tree.appendChild(build(TREE,0)); }

function show(n){
  const path=[]; (function find(list,tr){ for(const x of list){ const t=tr.concat(x.l); if(x.id===n.id){ path.push(...t); return true;} if(x.k&&find(x.k,t)) return true;} return false; })(TREE,[]);
  pane.innerHTML=
    '<h2>'+n.l+'</h2>'+
    '<div class="path">'+path.join('  ›  ')+'</div>'+
    (n.d?'<p class="desc">'+n.d+'</p>':'')+
    (n.s?'<div class="note"><b>'+S[n.s][0]+'</b> — '+(n.s==='legacy'?'대체된 기능이 남아 있어 정리하면 로딩이 가벼워집니다.':n.s==='check'?'발표 전에 확인하거나 손볼 지점입니다.':'현재 정상 동작 중입니다.')+'</div>':'')+
    '<div class="row"><div class="k">코드에서 찾을 위치</div><div class="v mono">'+(n.anc||'—')+'</div></div>'+
    '<div class="row"><div class="k">요소 번호</div><div class="v mono">'+n.id+'</div></div>'+
    ((n.k||[]).length?'<div class="row"><div class="k">하위 요소</div><div class="v">'+n.k.map(x=>x.l).join(' · ')+'</div></div>':'')+
    '<button class="cp" id="cpBtn">이 요소 수정 지시문 복사</button>';
  document.getElementById('cpBtn').onclick=()=>{
    const t='['+n.id+'] '+n.l+'\n위치: '+(n.anc||'')+'\n설명: '+(n.d||'')+'\n요청: ';
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject())
      .then(()=>toast(n.id+' 복사됨 — 뒤에 원하는 수정을 적으세요'))
      .catch(()=>toast('복사 실패 — "'+n.id+' 고쳐줘"라고 말해도 됩니다'));
  };
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2000);}

tree.addEventListener('click',e=>{
  const b=e.target.closest('.node'); if(!b) return;
  tree.querySelectorAll('.node.on').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  const kid=b.parentElement.querySelector('.kids');
  if(kid){ kid.classList.toggle('open'); b.querySelector('.tw').textContent=kid.classList.contains('open')?'▾':'▸'; }
  show(NODES[b.dataset.id]);
});
document.getElementById('q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();draw();});
document.getElementById('expand').onclick=()=>{tree.querySelectorAll('.kids').forEach(k=>k.classList.add('open'));tree.querySelectorAll('.tw').forEach(t=>{if(t.textContent==='▸')t.textContent='▾';});};
document.getElementById('collapse').onclick=()=>{tree.querySelectorAll('.kids').forEach((k,i)=>{if(i)k.classList.remove('open')});tree.querySelectorAll('.node').forEach(b=>{const k=b.parentElement.querySelector('.kids');if(k)b.querySelector('.tw').textContent=k.classList.contains('open')?'▾':'▸';});};
document.getElementById('legacy').onclick=e=>{onlyFlag=!onlyFlag;e.target.style.cssText=onlyFlag?'background:#1D4994;color:#fff;border-color:#1D4994':'';draw();};
draw();
</script>
